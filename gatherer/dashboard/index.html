<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Dashboard</title>
<style>
:root {
  --bg: #0f1216;
  --panel: #171b21;
  --panel-2: #1d232b;
  --line: #2a313b;
  --text: #e6e9ee;
  --muted: #8b94a3;
  --accent: #5fb36b;
  --accent-text: #0b1a0e;
  --warn: #e0a84a;
  --bad: #e06464;
  --info: #6aa7e8;
  --health: #e06464;
  --food: #d9944a;
  --radius: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --panel-2: #f6f7f9;
    --line: #dde1e6;
    --text: #1b1f24;
    --muted: #616b78;
    --accent: #2f8a3c;
    --accent-text: #ffffff;
    --warn: #b7791f;
    --bad: #c53030;
    --info: #2b6cb0;
    --health: #d64545;
    --food: #c27022;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 12px 16px;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
}
h1 { font-size: 17px; margin: 0 8px 0 0; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.on { background: var(--accent); }
.dot.off { background: var(--bad); }
form.cmd { display: flex; gap: 6px; flex: 1 1 420px; min-width: 0; }
select, input, button {
  font: inherit; color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 10px;
  min-width: 0;
}
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
form.cmd input { flex: 1; }
@media (max-width: 600px) {
  form.cmd { flex-wrap: wrap; }
  #target { flex: 1 1 100%; }
}
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.danger { color: var(--bad); }
main { padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
#bots { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.card.offline > :not(.top):not(.signin) { opacity: 0.55; }
.top { display: flex; align-items: center; gap: 8px; }
.top .name { font-weight: 650; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .label { color: var(--muted); font-size: 12px; }
.chip { margin-left: auto; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.working { color: var(--info); border-color: var(--info); }
.chip.idle { color: var(--accent); border-color: var(--accent); }
.chip.guarding { color: var(--warn); border-color: var(--warn); }
.chip.offline { color: var(--bad); border-color: var(--bad); }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.bar { height: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; transition: width 0.4s; }
.bar.health > i { background: var(--health); }
.bar.food > i { background: var(--food); }
.bar.task > i { background: var(--info); }
.num { font-variant-numeric: tabular-nums; color: var(--text); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.coords { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; cursor: pointer; }
.coords:hover { text-decoration: underline; }
.now { border-left: 3px solid var(--info); background: var(--panel-2); border-radius: 6px; padding: 6px 9px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.now[hidden] { display: none; }
.now.idle { border-left-color: var(--line); }
.now.guarding { border-left-color: var(--warn); }
.now .head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.now .what { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.now.idle .what { color: var(--muted); font-weight: normal; }
.now .for { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.now .goals { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.now .tag { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.task { display: flex; flex-direction: column; gap: 4px; }
.task .line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.muted { color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions button { padding: 5px 9px; font-size: 13px; }
form.get { display: flex; gap: 6px; }
form.get input[name=item] { flex: 1; }
form.get input[name=count] { width: 72px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.inv { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
aside {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  height: calc(100vh - 110px); min-height: 320px;
  position: sticky; top: 76px;
}
@media (max-width: 900px) { aside { position: static; height: 420px; } }
aside .head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
aside .head strong { margin-right: auto; }
aside .head button { padding: 5px 10px; font-size: 13px; }
#log { overflow-y: auto; padding: 8px 12px; font-size: 12.5px; flex: 1; }
#log .row { padding: 3px 0; border-bottom: 1px dashed var(--line); display: grid; grid-template-columns: auto auto 1fr; gap: 8px; }
#log .t { color: var(--muted); font-variant-numeric: tabular-nums; }
#log .b { font-weight: 600; }
#log .row.you .b { color: var(--info); }
#log .row.bad .msg { color: var(--bad); }
details.more { border-top: 1px solid var(--line); padding-top: 8px; }
details.more > summary { font-weight: 600; color: var(--text); }
.cmdgroup { margin-top: 10px; }
.cmdgroup h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.cmdgroup .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.cmdgroup .btns button { padding: 5px 9px; font-size: 13px; }
form.opt { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
form.opt > span { width: 74px; font-size: 13px; color: var(--muted); }
form.opt input, form.opt select { padding: 5px 8px; font-size: 13px; flex: 1 1 90px; }
form.opt input[type=number] { flex: 0 0 64px; }
form.opt button { padding: 5px 10px; font-size: 13px; }
.manage { display: none; gap: 6px; flex-wrap: wrap; }
body.managed .manage { display: flex; }
.power { margin-left: 4px; padding: 3px 10px; font-size: 12px; display: none; }
body.managed .power { display: inline-block; }
.chip.starting, .chip.queued, .chip.reconnecting { color: var(--info); border-color: var(--info); }
.chip.stopped { color: var(--muted); }
.signin { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 8px; padding: 10px; font-size: 13px; display: none; }
.signin.show { display: block; }
.signin code { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
.signin a { color: var(--info); }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }
.avatar { position: relative; flex: none; width: 28px; height: 28px; }
.avatar .dot { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border: 2px solid var(--panel); box-sizing: content-box; }
/* A player's face: the 8x8 face of their skin plus the hat layer on top. */
.face { display: inline-block; flex: none; width: 28px; height: 28px; border-radius: 4px; image-rendering: pixelated;
  background-size: 800% 800%; background-repeat: no-repeat; background-color: var(--panel-2);
  color: #fff; font-weight: 700; text-align: center; overflow: hidden; vertical-align: middle; }
.face.sm { width: 16px; height: 16px; border-radius: 3px; font-size: 10px; line-height: 16px; }
.face.letter { line-height: 28px; font-size: 14px; }
.face.sm.letter { line-height: 16px; font-size: 10px; }
#log .row { grid-template-columns: auto auto auto 1fr; align-items: center; }
#log .row .face { margin-right: -4px; }
.card { transition: box-shadow 0.2s, border-color 0.2s; }
.card.hurt { border-color: var(--bad); box-shadow: 0 0 0 2px color-mix(in srgb, var(--bad) 40%, transparent); }
.card.flash { border-color: var(--info); box-shadow: 0 0 0 2px color-mix(in srgb, var(--info) 40%, transparent); }
details.world:not([open]) > summary { border-bottom: 0; }
details.world[open] { border-bottom: 1px solid var(--line); }
details.world > summary { list-style: none; cursor: pointer; }
details.world > summary::-webkit-details-marker { display: none; }
details.world > summary::after { content: "▾"; color: var(--muted); }
details.world:not([open]) > summary::after { content: "▸"; }
#worldInfo { font-size: 12px; margin-right: auto; }
.mapwrap { position: relative; margin: 8px 12px 0; }
#map { display: block; width: 100%; height: 220px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); cursor: default; }
.maptip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
.players { padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; font-size: 13px; }
.players .p { display: flex; align-items: center; gap: 8px; }
.players .p .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.players .p .w { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
#alerts.on { color: var(--accent); border-color: var(--accent); }
.facts select.profile { padding: 2px 6px; font-size: 13px; }
.buildbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.buildbox[hidden] { display: none; }
.buildbox .line { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; align-items: baseline; }
.buildbox form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.buildbox form select, .buildbox form input { padding: 5px 8px; font-size: 13px; }
.buildbox form select[name=file] { flex: 1 1 160px; }
.buildbox form input.xyz { width: 70px; }
.buildbox form .xyzs { display: flex; gap: 4px; }
.buildbox form .xyzs[hidden] { display: none; }
.buildbox form label { font-size: 13px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.buildbox .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.buildbox .btns button { padding: 5px 10px; font-size: 13px; }
.buildbox table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.buildbox th { text-align: left; color: var(--muted); font-weight: 500; }
.buildbox td, .buildbox th { padding: 2px 4px; border-bottom: 1px dashed var(--line); }
.buildbox td.n, .buildbox th.n { text-align: right; font-variant-numeric: tabular-nums; }
.buildbox td.short { color: var(--bad); }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1><span id="conn" class="dot"></span> Bot Dashboard</h1>
  <form class="cmd" id="cmdForm" autocomplete="off">
    <select id="target" aria-label="Send to"></select>
    <input id="cmdText" placeholder="Command, e.g. get oak_log 64 · status · guard Zentyre" aria-label="Command">
    <button class="primary">Send</button>
  </form>
  <button type="button" id="alerts" title="Desktop notifications when a bot dies, finishes its tasks, needs a sign-in or disconnects (while this tab is in the background)">Alerts: off</button>
  <div class="manage">
    <button type="button" data-control="startAll">Start all</button>
    <button type="button" data-control="stopAll">Stop all</button>
    <button type="button" data-control="update" title="Download the latest version">Update</button>
    <button type="button" data-control="restart" title="Restart the program (after an update)">Restart</button>
    <button type="button" class="danger" data-control="shutdown">Shut down</button>
  </div>
</header>
<main>
  <section id="bots"><div class="empty">Waiting for bots…</div></section>
  <aside>
    <details class="world" id="world" open>
      <summary class="head"><strong>World</strong><span id="worldInfo" class="muted"></span></summary>
      <div class="mapwrap"><canvas id="map" aria-label="Map of the bots and players nearby"></canvas><div id="mapTip" class="maptip"></div></div>
      <div id="players" class="players"></div>
    </details>
    <div class="head"><strong>Activity</strong><select id="logFilter" aria-label="Show log for"><option value="">All bots</option></select><button type="button" id="clearLog" title="Clear the activity log">Clear</button></div>
    <div id="log"></div>
  </aside>
</main>
<datalist id="items"></datalist>
<div class="toast" id="toast"></div>
<script>
const state = { bots: new Map(), logs: [] };
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pretty = (s) => String(s || "").replace(/_/g, " ");
const duration = (s) => (s == null ? "" : s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s` : `${Math.floor(s / 3600)}h ${String(Math.floor(s / 60) % 60).padStart(2, "0")}m`);

// ---------- player faces ----------
// The face is the 8x8 square at (8, 8) of a 64x64 skin, the hat layer the one
// at (40, 8): as background positions, 8/56 and 40/56 of the way across.
function nameColor(name) {
  let h = 0;
  for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 45% 42%)`;
}
function faceHTML(skin, name, small = false) {
  const cls = "face" + (small ? " sm" : "");
  if (!skin) return `<span class="${cls} letter" style="background-color:${nameColor(name)}" aria-hidden="true">${esc(String(name || "?")[0].toUpperCase())}</span>`;
  const url = `url(skin/${skin})`;
  return `<span class="${cls}" style="background-image:${url},${url};background-position:71.4286% 14.2857%,14.2857% 14.2857%" aria-hidden="true"></span>`;
}
const skinImages = new Map();
function skinImage(skin) {
  if (!skinImages.has(skin)) {
    const img = new Image();
    img.onload = () => requestMap();
    img.src = "skin/" + skin;
    skinImages.set(skin, img);
  }
  const img = skinImages.get(skin);
  return img.complete && img.naturalWidth ? img : null;
}
const botNames = () => new Set([...state.bots.values()].flatMap((b) => [b.name, b.label]).filter(Boolean).map((n) => n.toLowerCase()));

function toast(text) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 1600);
}

async function command(target, text) {
  try {
    const res = await fetch("command", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ target, text }) });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
  } catch (err) {
    toast("Couldn't send: " + err.message);
  }
}

async function control(action, bot) {
  try {
    const res = await fetch("control", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action, bot }) });
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
  } catch (err) {
    toast("Couldn't do that: " + err.message);
  }
}
document.querySelector(".manage").addEventListener("click", (e) => {
  const action = e.target.closest("button")?.dataset.control;
  if (!action) return;
  if (action === "shutdown" && !confirm("Disconnect every bot and close Dashboard? Start it again with Start Dashboard.")) return;
  if (action === "stopAll" && !confirm("Disconnect every bot?")) return;
  control(action);
  if (action === "shutdown") toast("Shutting down…");
  if (action === "restart") toast("Restarting… this page reconnects by itself.");
});

// ---------- header: target picker and command line ----------
function renderTargets() {
  const sel = $("#target"), filter = $("#logFilter");
  const keep = sel.value, keepFilter = filter.value;
  const bots = [...state.bots.values()];
  const opts = [];
  if (bots.length > 1) opts.push(["auto", "Crew (split jobs)"], ["all", "All bots"]);
  for (const b of bots) opts.push([b.label, b.name || b.label]);
  if (!opts.length) opts.push(["auto", "Bot"]);
  sel.innerHTML = opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("");
  if ([...sel.options].some((o) => o.value === keep)) sel.value = keep;
  filter.innerHTML = `<option value="">All bots</option>` + bots.map((b) => `<option value="${esc(b.label)}">${esc(b.name || b.label)}</option>`).join("");
  filter.value = keepFilter;
}
$("#cmdForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("#cmdText").value.trim();
  if (!text) return;
  command($("#target").value, text);
  $("#cmdText").value = "";
});

// ---------- bot cards ----------
const QUICK = [["status", "Status"], ["inv", "Inventory"], ["eat", "Eat"], ["sleep", "Sleep"], ["home", "Home"], ["deposit", "Deposit"], ["armor", "Armor"]];

// Every command, for the "All commands" panel under each bot.
const SIMPLE = [
  ["Info", [["status", "Status"], ["queue", "Queue"], ["inv", "Inventory"], ["learned", "What it learned"], ["profile", "Profile"], ["build", "Build status"], ["help", "Help"]]],
  ["Actions", [["come", "Come to me"], ["eat", "Eat"], ["sleep", "Sleep"], ["home", "Go home"], ["deposit", "Deposit in chest"],
    ["farm", "Harvest & replant"], ["water", "Place water"], ["bucket", "Fill a bucket"], ["armor", "Wear best armor"]]],
];
const sel = (name, options, label) => `<select name="${name}" aria-label="${label}">${options.map((o) => `<option value="${o}">${pretty(o) || "normal"}</option>`).join("")}</select>`;
const POTIONS = ["awkward", "healing", "swiftness", "strength", "night_vision", "fire_resistance", "regeneration", "water_breathing", "leaping", "slow_falling", "poison", "turtle_master", "weakness", "invisibility", "harming", "slowness"];
// [label, command template, fields html]; {field} placeholders, empty ones are dropped.
const OPTIONS = [
  ["Plan", "plan {item}", `<input name="item" list="items" placeholder="item, e.g. iron_pickaxe" aria-label="Item">`],
  ["Plant", "plant {crop} {plots}", sel("crop", ["wheat", "carrot", "potato", "beetroot"], "Crop") + `<input name="plots" type="number" min="1" value="9" aria-label="Plots">`],
  ["Breed", "breed {animal} {pairs}", sel("animal", ["cow", "sheep", "pig", "chicken", "goat", "rabbit", "mooshroom"], "Animal") + `<input name="pairs" type="number" min="1" value="1" aria-label="Pairs">`],
  ["Brew", "brew {potion} {count} {mod}", sel("potion", POTIONS, "Potion") + `<input name="count" type="number" min="1" value="3" aria-label="How many">` + sel("mod", ["", "long", "strong", "splash", "lingering"], "Modifier")],
  ["Armor set", "armor {material}", sel("material", ["leather", "golden", "iron", "diamond"], "Material")],
  ["Guard", "guard {player}", `<input name="player" placeholder="player (empty = you)" aria-label="Player">`],
  ["Bow", "bow {arrows}", `<input name="arrows" type="number" min="1" value="16" aria-label="Arrows">`],
  ["Give me", "give {item} {count}", `<input name="item" list="items" placeholder="item, or all" aria-label="Item">` + `<input name="count" type="number" min="1" placeholder="all" aria-label="How many">`],
  ["Say", "say {text}", `<input name="text" placeholder="message for chat" aria-label="Message">`],
];
const CAREFUL = [["stop", "Stop", false], ["forget", "Forget everything learned", true], ["quit", "Disconnect", true]];

function commandsPanel() {
  const groups = SIMPLE.map(([title, list]) =>
    `<div class="cmdgroup"><h4>${title}</h4><div class="btns">${list.map(([c, t]) => `<button type="button" data-cmd="${c}">${t}</button>`).join("")}</div></div>`).join("");
  const forms = OPTIONS.map(([label, tpl, fields]) =>
    `<form class="opt" data-tpl="${tpl}" autocomplete="off"><span>${label}</span>${fields}<button class="primary">${label.split(" ")[0]}</button></form>`).join("");
  const careful = CAREFUL.map(([c, t, ask]) => `<button type="button" class="danger" data-cmd="${c}"${ask ? ' data-confirm="1"' : ""}>${t}</button>`).join("");
  return `<details class="more"><summary>All commands</summary>${groups}<div class="cmdgroup"><h4>With options</h4>${forms}</div><div class="cmdgroup"><h4>Careful</h4><div class="btns">${careful}</div></div></details>`;
}

// "brew {potion} {count} {mod}" + the form's values -> "brew healing 3 splash"
function fillTemplate(tpl, form) {
  return tpl.replace(/\{(\w+)\}/g, (_, name) => {
    // (not form.elements[name]: elements.item is a built-in method, not the "item" field)
    const v = String(form.querySelector(`[name="${name}"]`)?.value ?? "").trim();
    return name === "text" ? v : v.toLowerCase().replace(/\s+/g, "_");
  }).replace(/\s+/g, " ").trim();
}

function makeCard(label) {

  card.innerHTML = `
    <div class="top"><span class="avatar"><span class="face"></span><span class="dot"></span></span><span class="name"></span><span class="label"></span><span class="chip"></span><button type="button" class="power"></button></div>
    <div class="signin"></div>
    <div class="bars">
      <span>Health</span><div class="bar health"><i></i></div><span class="num hp"></span>
      <span>Food</span><div class="bar food"><i></i></div><span class="num fd"></span>
    </div>
    <div class="now" hidden><div class="head"><span class="tag">Now</span><span class="what"></span><span class="for"></span></div><div class="goals"></div></div>
    <div class="task"></div>

      <dt>Position</dt><dd><span class="coords" title="Click to copy"></span></dd>

        <select name="file" aria-label="Schematic"></select>

        <input type="file" class="uploadfile" accept=".litematic,.schem,.nbt" hidden>
        <select name="where" aria-label="Where">
          <option value="me">Where I stand</option>
          <option value="here">Where the bot is</option>

        <label title="Also dig out player-made blocks in the way (natural ground and plants are always cleared)"><input type="checkbox" name="clear"> clear</label>

  more.addEventListener("click", (e) => {

function renderBot(b) {
  const root = $("#bots");
  $(".empty", root)?.remove();
  let card = root.querySelector(`[data-label="${CSS.escape(b.label)}"]`);
  if (!card) {
    card = makeCard(b.label);
    root.appendChild(card);
  }
  card.classList.toggle("offline", !b.online);
  const face = $(".avatar .face", card);
  const faceKey = `${b.skin || ""}|${b.name || b.label}`;
  if (face.dataset.key !== faceKey) {
    face.outerHTML = faceHTML(b.skin, b.name || b.label);
    $(".avatar .face", card).dataset.key = faceKey;
  }
  $(".top .dot", card).className = "dot " + (b.online ? "on" : "off");
  $(".name", card).textContent = b.name || b.label;
  $(".label", card).textContent = b.name && b.name !== b.label ? b.label : "";
  const chip = $(".chip", card);
  const state = b.online ? "online" : b.state || "offline";
  const mode = b.online ? (b.ward ? "guarding" : b.busy ? "working" : "idle") : state;
  const secs = b.reconnectAt ? Math.max(0, Math.round((b.reconnectAt - Date.now()) / 1000)) : 0;
  chip.className = "chip " + mode;
  chip.textContent = {
    guarding: "Guarding " + b.ward, working: "Working", idle: "Idle",
    stopped: "Stopped", queued: "Queued", starting: b.signIn ? "Sign in needed" : "Starting…",
    reconnecting: `Reconnecting${secs ? " in " + secs + "s" : "…"}`, offline: "Offline",
  }[mode] || mode;
  const power = $(".power", card);
  const running = ["online", "starting", "queued", "reconnecting"].includes(state);
  power.dataset.action = running ? "stop" : "start";
  power.textContent = running ? "Stop" : "Start";
  power.className = "power" + (running ? " danger" : " primary");
  const signin = $(".signin", card);
  if (b.signIn && !b.online) {
    const mins = Math.max(0, Math.round((b.signIn.expiresAt - Date.now()) / 60000));
    signin.innerHTML = `<b>Sign in this bot's Microsoft account.</b> Open <a href="${esc(b.signIn.uri)}" target="_blank" rel="noopener">${esc(b.signIn.uri)}</a> (a private window is best) and enter <code>${esc(b.signIn.code)}</code> <button type="button" class="copy">Copy</button><div class="muted">Expires in ${mins} min.</div>`;
    $(".copy", signin).onclick = () => navigator.clipboard?.writeText(b.signIn.code).then(() => toast("Copied " + b.signIn.code));
    signin.classList.add("show");
  } else {
    signin.classList.remove("show");
    signin.innerHTML = "";
  }

  const hp = b.health ?? 0, fd = b.food ?? 0;
  $(".bar.health > i", card).style.width = (hp / 20) * 100 + "%";
  $(".bar.food > i", card).style.width = (fd / 20) * 100 + "%";
  $(".hp", card).textContent = b.online ? `${hp}/20` : "–";
  $(".fd", card).textContent = b.online ? `${fd}/20` : "–";

  const now = $(".now", card);
  now.hidden = !b.online || !b.doing;
  if (b.online && b.doing) {
    const d = b.doing;
    const goals = d.goals || [];
    const what = d.step || (b.ward ? `Guarding ${b.ward}` : goals.length ? `Working on ${goals[goals.length - 1]}` : "Idle");
    now.className = "now" + (b.ward ? " guarding" : !d.step && !goals.length ? " idle" : "");
    $(".what", now).textContent = what;
    $(".for", now).textContent = duration(d.seconds);
    $(".for", now).title = "How long it has been at this";
    const goalsEl = $(".goals", now);
    goalsEl.textContent = goals.length ? "for " + goals.join(" › ") : "";
    goalsEl.hidden = !goals.length;
  }

  const task = $(".task", card);
  if (b.task) {
    const pct = b.task.count ? Math.round((b.task.done / b.task.count) * 100) : 0;
    task.innerHTML = `<div class="line"><span>Getting <b>${esc(pretty(b.task.item))}</b></span><span class="num">${b.task.done}/${b.task.count}</span></div><div class="bar task"><i style="width:${pct}%"></i></div>`;
  } else {
    task.innerHTML = `<div class="line muted">${b.online ? (b.ward ? "On guard duty" : "No task") : state === "stopped" ? "Not running" : "Not connected"}</div>`;
  }

  const p = b.position;
  $(".coords", card).textContent = p ? `${p.x} ${p.y} ${p.z}` : "–";
  $(".coords", card).title = p ? `${pretty(b.dimension) || "world"} · click to copy` : "";
  $(".held", card).textContent = !b.online ? "–" : b.held ? pretty(b.held) : "nothing";
  $(".armor", card).textContent = !b.online ? "–" : b.armor?.length ? b.armor.map(pretty).join(", ") : "none";
  $(".xp", card).textContent = b.online && b.xp != null ? `${b.xp}` : "–";
  const psel = $("select.profile", card);
  const profiles = b.profiles || ["default"];
  if (psel.dataset.list !== profiles.join(",")) {
    psel.innerHTML = profiles.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
    psel.dataset.list = profiles.join(",");
  }
  if (document.activeElement !== psel) psel.value = b.profile || "default";
  psel.disabled = !b.online;
  renderBuild(card, b);
  $(".record", card).textContent = b.stats ? `${b.stats.kills} kills · ${b.stats.deaths} deaths` : "–";
  $(".queue", card).innerHTML = b.queue?.length
    ? `<span class="pills">${b.queue.map((q) => `<span class="pill">${esc(pretty(q.item))} ×${q.count}</span>`).join("")}</span>`
    : `<span class="muted">empty</span>`;
  const inv = b.inventory || [];
  $(".invsum", card).textContent = `Inventory · ${inv.reduce((n, i) => n + i.count, 0)} items` + (b.freeSlots != null ? ` · ${b.freeSlots} free slots` : "");
  $(".inv", card).innerHTML = inv.length ? inv.map((i) => `<span class="pill">${esc(pretty(i.name))} ×${i.count}</span>`).join("") : `<span class="muted">empty</span>`;
}

// ---------- building ----------
let schematicFiles = [];
function fillSchematicSelect(sel, pick) {
  const keep = pick || sel.value;
  sel.innerHTML = schematicFiles.length
    ? schematicFiles.map((f) => `<option value="${esc(f)}">${esc(f)}</option>`).join("")
    : `<option value="">No schematics yet</option>`;
  if (schematicFiles.includes(keep)) sel.value = keep;
}
async function loadSchematics(pick) {
  try {
    schematicFiles = await (await fetch("schematics")).json();
  } catch (err) {
    return;
  }
  for (const sel of document.querySelectorAll(".buildform select[name=file]")) fillSchematicSelect(sel, pick);
}
function renderBuild(card, b) {
  const box = $(".buildbox", card);
  box.hidden = !(b.online && b.builder);
  if (box.hidden) return;
  const s = b.build;
  $(".bstate", box).textContent = s ? `${s.name} · ${s.state}` : "nothing yet";
  const prog = $(".bprogress", box);
  if (s) {
    const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
    const extra = [s.blocked ? `${s.blocked} in the way` : "", s.failed ? `${s.failed} failed` : "", Object.keys(s.missing || {}).length ? `missing ${Object.entries(s.missing).map(([i, n]) => `${n} ${pretty(i)}`).join(", ")}` : ""].filter(Boolean).join(" · ");
    prog.innerHTML = `<div class="line"><span>${s.done}/${s.total} blocks${s.turns ? ` · turned ${s.turns * 90}°` : ""} · at ${s.origin.x} ${s.origin.y} ${s.origin.z}</span><span class="num">${pct}%</span></div><div class="bar task"><i style="width:${pct}%"></i></div>${extra ? `<div class="muted" style="font-size:12px">${esc(extra)}</div>` : ""}`;
  } else {
    prog.innerHTML = "";
  }
  const mats = s?.materials || [];
  $(".bmaterials", box).innerHTML = mats.length
    ? `<table><tr><th>Still to place</th><th class="n">need</th><th class="n">has</th><th class="n">chests</th></tr>${mats.map((m) =>
        `<tr><td>${esc(pretty(m.item))}</td><td class="n">${m.need}</td><td class="n${m.have + m.chests < m.need ? " short" : ""}">${m.have}</td><td class="n">${m.chests}</td></tr>`).join("")}</table>`
    : "";
}

// ---------- log ----------
const time = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
function logRow(entry) {
  const bot = state.bots.get(entry.bot);
  const who = entry.bot === "you" ? "You" : bot?.name || entry.bot;
  const bad = /couldn't|error|died|kicked|disconnect|refus|won't/i.test(entry.text);
  const face = bot ? faceHTML(bot.skin, who, true) : "<span></span>";
  return `<div class="row${entry.bot === "you" ? " you" : ""}${bad ? " bad" : ""}" data-bot="${esc(entry.bot)}"><span class="t">${time(entry.t)}</span>${face}<span class="b">${esc(who)}</span><span class="msg">${esc(entry.text)}</span></div>`;
}
// Newest first, so the latest is always at the top without scrolling.
function renderLog() {
  const f = $("#logFilter").value;
  const rows = state.logs.filter((e) => !f || e.bot === f || e.bot === "you");
  const el = $("#log");
  el.innerHTML = rows.length ? rows.slice().reverse().map(logRow).join("") : `<div class="muted nolog">Nothing yet.</div>`;
  el.scrollTop = 0;
}
function addLog(entry) {
  logAlert(entry);
  state.logs.push(entry);
  if (state.logs.length > 400) state.logs.shift();
  const f = $("#logFilter").value;
  if (f && entry.bot !== f && entry.bot !== "you") return;
  const el = $("#log");
  $(".nolog", el)?.remove();
  const before = el.scrollHeight;
  el.insertAdjacentHTML("afterbegin", logRow(entry));
  while (el.children.length > 400) el.lastChild.remove();
  // Reading further down? Keep what you're looking at in place.
  if (el.scrollTop > 0) el.scrollTop += el.scrollHeight - before;
}
$("#logFilter").addEventListener("change", renderLog);
$("#clearLog").addEventListener("click", async () => {
  try {
    const res = await fetch("clear-log", { method: "POST" });
    if (!res.ok) throw new Error(res.statusText);
  } catch (err) {
    toast("Couldn't clear: " + err.message);
  }
});

// ---------- world: time, weather, players, map ----------
function flashCard(label, cls) {
  const card = $(`#bots [data-label="${CSS.escape(label)}"]`);
  if (!card) return;
  card.classList.add(cls);
  setTimeout(() => card.classList.remove(cls), 700);
}

function clock(t) {
  const hours = Math.floor((t / 1000 + 6) % 24);
  const minutes = Math.floor(((t % 1000) * 60) / 1000);
  return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
}

// Everyone on the server, from all the bots' player lists; where they are,
// if some bot can see them.
function allPlayers() {
  const mine = botNames();
  const seen = new Map();
  for (const b of state.bots.values()) {
    if (!b.online) continue;
    for (const p of b.players || []) {
      if (mine.has(p.name.toLowerCase())) continue;
      const near = p.pos && b.position ? Math.round(Math.hypot(p.pos.x - b.position.x, p.pos.z - b.position.z)) : null;
      const entry = { ...p, dimension: b.dimension, near: near != null ? { bot: b.name || b.label, distance: near } : null };
      const old = seen.get(p.name);
      if (!old || (entry.near && (!old.near || entry.near.distance < old.near.distance))) seen.set(p.name, entry);
    }
  }
  return [...seen.values()].sort((a, b) => a.name.localeCompare(b.name));
}

function renderWorld() {
  const online = [...state.bots.values()].filter((b) => b.online);
  document.title = state.bots.size ? `Dashboard · ${online.length}/${state.bots.size} online` : "Bot Dashboard";
  const ref = online.find((b) => /overworld/.test(b.dimension || "")) || online[0];
  const info = [];
  if (ref && ref.time != null) {
    const night = ref.time >= 13000 && ref.time < 23000;
    if (ref.day != null) info.push(`Day ${ref.day}`);
    info.push(`${clock(ref.time)}${night ? " (night)" : ""}`);
    info.push({ clear: "clear", rain: "rain", thunder: "thunderstorm" }[ref.weather] || "");
  }
  $("#worldInfo").textContent = info.filter(Boolean).join(" · ");
  const players = allPlayers();
  $("#players").innerHTML = online.length
    ? players.length
      ? players.map((p) => {
          const where = p.near ? `${p.near.distance} m from ${p.near.bot}` : "not in sight";
          const ping = p.ping != null ? ` · ${p.ping} ms` : "";
          return `<div class="p" title="${esc(p.name)}${p.pos ? ` at ${p.pos.x} ${p.pos.y} ${p.pos.z}` : ""}">${faceHTML(p.skin, p.name, true)}<span class="n">${esc(p.name)}</span><span class="w">${esc(where + ping)}</span></div>`;
        }).join("")
      : `<div class="muted">No other players online.</div>`
    : `<div class="muted">No bot online to see the server.</div>`;
  requestMap();
}

// A top-down map: north up, east right, scaled to fit the bots, the players
// they can see, and their homes.
let mapQueued = false;
let mapTargets = [];
function requestMap() {
  if (mapQueued) return;
  mapQueued = true;
  requestAnimationFrame(() => {
    mapQueued = false;
    drawMap();
  });
}
function drawMap() {
  const canvas = $("#map");
  if (!canvas || !$("#world").open) return;
  const css = getComputedStyle(document.documentElement);
  const color = (name) => css.getPropertyValue(name).trim();
  const ratio = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== Math.round(W * ratio) || canvas.height !== Math.round(H * ratio)) {
    canvas.width = Math.round(W * ratio);
    canvas.height = Math.round(H * ratio);
  }
  const g = canvas.getContext("2d");
  g.setTransform(ratio, 0, 0, ratio, 0, 0);
  g.clearRect(0, 0, W, H);
  g.imageSmoothingEnabled = false;
  g.font = "11px system-ui, sans-serif";
  mapTargets = [];

  const bots = [...state.bots.values()].filter((b) => b.online && b.position);
  if (!bots.length) {
    g.fillStyle = color("--muted");
    g.textAlign = "center";
    g.fillText("No bots online", W / 2, H / 2);
    return;
  }
  // The dimension most bots are in; the others are listed underneath.
  const counts = {};
  for (const b of bots) counts[b.dimension] = (counts[b.dimension] || 0) + 1;
  const dim = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const here = bots.filter((b) => b.dimension === dim);
  const players = allPlayers().filter((p) => p.pos && p.dimension === dim);
  const homes = [];
  for (const b of here) if (b.home && !homes.some((h) => h.x === b.home.x && h.z === b.home.z)) homes.push(b.home);

  const xs = [...here.map((b) => b.position.x), ...players.map((p) => p.pos.x), ...homes.map((h) => h.x)];
  const zs = [...here.map((b) => b.position.z), ...players.map((p) => p.pos.z), ...homes.map((h) => h.z)];
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cz = (Math.min(...zs) + Math.max(...zs)) / 2;
  const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs), 32) * 1.3 + 16;
  const scale = Math.min(W, H) / span; // pixels per block
  const sx = (x) => W / 2 + (x - cx) * scale, sz = (z) => H / 2 + (z - cz) * scale;

  // Grid: chunk lines when zoomed in, coarser further out.
  const step = [16, 64, 256, 1024, 4096].find((s) => s * scale >= 28) || 16384;
  g.strokeStyle = color("--line");
  g.lineWidth = 1;
  g.beginPath();
  for (let x = Math.ceil((cx - W / 2 / scale) / step) * step; sx(x) < W; x += step) { g.moveTo(Math.round(sx(x)) + 0.5, 0); g.lineTo(Math.round(sx(x)) + 0.5, H); }
  for (let z = Math.ceil((cz - H / 2 / scale) / step) * step; sz(z) < H; z += step) { g.moveTo(0, Math.round(sz(z)) + 0.5); g.lineTo(W, Math.round(sz(z)) + 0.5); }
  g.stroke();

  // Scale bar and north.
  g.fillStyle = color("--muted");
  g.strokeStyle = color("--muted");
  g.textAlign = "left";
  g.beginPath();
  g.moveTo(8, H - 10); g.lineTo(8 + step * scale, H - 10);
  g.moveTo(8, H - 14); g.lineTo(8, H - 6); g.moveTo(8 + step * scale, H - 14); g.lineTo(8 + step * scale, H - 6);
  g.stroke();
  g.fillText(`${step} blocks`, 12 + step * scale, H - 6);
  g.textAlign = "right";
  g.fillText(`N ↑  ·  ${pretty(dim) || "world"}`, W - 8, 14);
  const elsewhere = bots.filter((b) => b.dimension !== dim);
  if (elsewhere.length) g.fillText(elsewhere.map((b) => `${b.name || b.label}: ${pretty(b.dimension)}`).join(", "), W - 8, H - 6);

  const face = (skin, name, x, y, size) => {
    const img = skin && skinImage(skin);
    if (img) {
      g.drawImage(img, 8, 8, 8, 8, x - size / 2, y - size / 2, size, size);
      g.drawImage(img, 40, 8, 8, 8, x - size / 2, y - size / 2, size, size);
    } else {
      g.fillStyle = nameColor(name);
      g.fillRect(x - size / 2, y - size / 2, size, size);
      g.fillStyle = "#fff";
      g.textAlign = "center";
      g.font = `bold ${Math.round(size * 0.65)}px system-ui, sans-serif`;
      g.fillText(String(name)[0].toUpperCase(), x, y + size * 0.24);
      g.font = "11px system-ui, sans-serif";
    }
  };
  const label = (text, x, y, muted) => {
    g.textAlign = "center";
    g.fillStyle = color(muted ? "--muted" : "--text");
    g.fillText(text, x, y);
  };

  for (const h of homes) {
    const x = sx(h.x), y = sz(h.z);
    g.fillStyle = color("--muted");
    g.beginPath();
    g.moveTo(x, y - 6); g.lineTo(x + 6, y); g.lineTo(x + 4, y); g.lineTo(x + 4, y + 5); g.lineTo(x - 4, y + 5); g.lineTo(x - 4, y); g.lineTo(x - 6, y);
    g.closePath();
    g.fill();
    mapTargets.push({ x, y, r: 7, text: `Home (${h.x} ${h.y} ${h.z})` });
  }
  // Workbenches the bots use (their remembered crafting tables, furnaces…).
  const benches = [];
  for (const b of here) for (const w of b.workbenches || []) if (!benches.some((o) => o.x === w.x && o.y === w.y && o.z === w.z)) benches.push(w);
  for (const w of benches) {
    const x = sx(w.x), y = sz(w.z);
    if (x < 0 || y < 0 || x > W || y > H) continue;
    g.fillStyle = color("--muted");
    g.fillRect(x - 3, y - 3, 6, 6);
    g.fillStyle = color(w.name === "crafting_table" ? "--warn" : "--info");
    g.fillRect(x - 2, y - 2, 4, 4);
    mapTargets.push({ x, y, r: 5, text: `${pretty(w.name)} (${w.x} ${w.y} ${w.z})` });
  }
  for (const p of players) {
    const x = sx(p.pos.x), y = sz(p.pos.z);
    face(p.skin, p.name, x, y, 12);
    label(p.name, x, y + 17, true);
    mapTargets.push({ x, y, r: 8, text: `${p.name} (${p.pos.x} ${p.pos.y} ${p.pos.z})` });
  }
  for (const b of here) {
    const x = sx(b.position.x), y = sz(b.position.z);
    const name = b.name || b.label;
    if (b.yaw != null) {
      // facing: mineflayer's yaw 0 looks north (-z)
      const dx = -Math.sin(b.yaw), dz = -Math.cos(b.yaw);
      g.fillStyle = color("--info");
      g.beginPath();
      g.moveTo(x + dx * 15, y + dz * 15);
      g.lineTo(x + dx * 9 - dz * 4, y + dz * 9 + dx * 4);
      g.lineTo(x + dx * 9 + dz * 4, y + dz * 9 - dx * 4);
      g.closePath();
      g.fill();
    }
    g.fillStyle = color(b.ward ? "--warn" : b.busy ? "--info" : "--accent");
    g.fillRect(x - 10, y - 10, 20, 20);
    face(b.skin, name, x, y, 16);
    label(name, x, y + 22, false);
    mapTargets.push({ x, y, r: 11, label: b.label, text: `${name} (${b.position.x} ${b.position.y} ${b.position.z})${b.doing?.step ? " · " + b.doing.step : ""}` });
  }
}
function mapTargetAt(e) {
  const r = $("#map").getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null;
  for (const t of mapTargets) {
    const d = Math.hypot(t.x - x, t.y - y);
    if (d <= t.r + 3 && (!best || d < best.d)) best = { ...t, d };
  }
  return best ? { ...best, mx: x, my: y } : null;
}
$("#map").addEventListener("mousemove", (e) => {
  const hit = mapTargetAt(e);
  const tip = $("#mapTip");
  $("#map").style.cursor = hit?.label ? "pointer" : "default";
  if (!hit) return (tip.style.display = "none");
  tip.textContent = hit.text;
  tip.style.display = "block";
  tip.style.left = Math.max(0, Math.min(hit.mx + 12, $("#map").clientWidth - tip.offsetWidth)) + "px";
  tip.style.top = hit.my + 12 + "px";
});
$("#map").addEventListener("mouseleave", () => ($("#mapTip").style.display = "none"));
$("#map").addEventListener("click", (e) => {
  const hit = mapTargetAt(e);
  if (!hit?.label) return;
  const card = $(`#bots [data-label="${CSS.escape(hit.label)}"]`);
  card?.scrollIntoView({ behavior: "smooth", block: "center" });
  flashCard(hit.label, "flash");
});
window.addEventListener("resize", requestMap);
const world = $("#world");
try {
  world.open = localStorage.getItem("world") !== "0";
} catch (err) {}
world.addEventListener("toggle", () => {
  try {
    localStorage.setItem("world", world.open ? "1" : "0");
  } catch (err) {}
  requestMap();
});

// ---------- desktop notifications ----------
// Only while this tab is in the background: when it's in front, the log says it.
let alertsOn = false;
try {
  alertsOn = localStorage.getItem("alerts") === "1" && "Notification" in window && Notification.permission === "granted";
} catch (err) {}
function showAlerts() {
  $("#alerts").textContent = "Alerts: " + (alertsOn ? "on" : "off");
  $("#alerts").classList.toggle("on", alertsOn);
}
$("#alerts").addEventListener("click", async () => {
  if (!("Notification" in window)) return toast("This browser can't show notifications.");
  if (!alertsOn && Notification.permission !== "granted") {
    const answer = await Notification.requestPermission();
    if (answer !== "granted") return toast("Notifications are blocked for this page in the browser's settings.");
  }
  alertsOn = !alertsOn;
  try {
    localStorage.setItem("alerts", alertsOn ? "1" : "0");
  } catch (err) {}
  showAlerts();
  toast(alertsOn ? "You'll get a notification when something happens while this tab is in the background." : "Alerts off.");
});
showAlerts();
const lastAlert = new Map();
function notify(key, title, body) {
  if (!alertsOn || document.visibilityState === "visible") return;
  const now = Date.now();
  if (now - (lastAlert.get(key) || 0) < 30000) return; // not the same thing over and over
  lastAlert.set(key, now);
  try {
    const n = new Notification(title, { body, tag: key });
    n.onclick = () => {
      window.focus();
      n.close();
    };
  } catch (err) {}
}
function logAlert(entry) {
  const bot = state.bots.get(entry.bot);
  if (!bot) return;
  const name = bot.name || bot.label;
  if (/^Died\b/.test(entry.text)) notify(`died:${entry.bot}`, `${name} died`, entry.text);
  else if (/^All tasks done/.test(entry.text)) notify(`done:${entry.bot}`, `${name} is done`, "All tasks done.");
  else if (/^Couldn't get /.test(entry.text)) notify(`gaveup:${entry.bot}`, `${name} gave up`, entry.text);
}
function statusAlert(prev, b) {
  const name = b.name || b.label;
  if (b.signIn && !prev?.signIn) notify(`signin:${b.label}`, `${name} needs a sign-in`, `Enter ${b.signIn.code} at ${b.signIn.uri}`);
  if (prev?.online && !b.online && b.state !== "stopped") notify(`offline:${b.label}`, `${name} disconnected`, b.state === "reconnecting" ? "Reconnecting by itself." : "");
  if (prev?.online && b.online && b.health <= 6 && prev.health > 6) notify(`hurt:${b.label}`, `${name} is badly hurt`, `Health ${b.health}/20`);
}

// ---------- live updates ----------
function connect() {
  const es = new EventSource("events");
  es.addEventListener("open", () => ($("#conn").className = "dot on"));
  es.addEventListener("error", () => ($("#conn").className = "dot off"));
  es.addEventListener("snapshot", (e) => {
    const data = JSON.parse(e.data);
    state.bots.clear();
    for (const b of data.bots) state.bots.set(b.label, b);
    state.logs = data.logs;
    document.body.classList.toggle("managed", Boolean(data.manager));
    $("#bots").innerHTML = state.bots.size ? "" : `<div class="empty">Waiting for bots…</div>`;
    for (const b of state.bots.values()) renderBot(b);
    renderTargets();
    renderLog();
    renderWorld();
  });
  es.addEventListener("status", (e) => {
    const b = JSON.parse(e.data);
    const prev = state.bots.get(b.label);
    const known = Boolean(prev);
    const renamed = known && prev.name !== b.name;
    state.bots.set(b.label, b);
    renderBot(b);
    if (!known || renamed) renderTargets();
    statusAlert(prev, b);
    if (prev?.online && b.online && b.health < prev.health) flashCard(b.label, "hurt");
    renderWorld();
  });
  es.addEventListener("log", (e) => addLog(JSON.parse(e.data)));
  es.addEventListener("clear", () => {
    state.logs = [];
    renderLog();
  });
}
connect();
loadItems();
loadSchematics();
// keep "Reconnecting in Ns" counting down
setInterval(() => { for (const b of state.bots.values()) if (b.state === "reconnecting" && !b.online) renderBot(b); }, 1000);
</script>
